<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Button</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-image: linear-gradient(to bottom, black, gray);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            
            width: 100%;
            height: 100vh;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            width: 85%;
            height: 95%;

            background-color: rgba(255, 255, 255, 0.150);
            
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        .animalButtons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;

            height: 100%;

            transform: translateY(-25%);
        }

        button {
            width: 250px;
            height: 250px;

            background-color: rgba(255, 255, 255, 0.163);
            border-radius: 10px;
            box-shadow: 0 5px 10px black;
            

            transition: all 0.1s ease-in-out;
        }

        button:hover {
            box-shadow: 0 5px 10px white;
            width: 255px;
            height: 255px;
            cursor: pointer;
        }

        button:active {
            width: 230px;
            height: 230px;
        }

        .photo {
            background-image: url("https://cdn.pixabay.com/photo/2023/10/26/10/33/cat-8342384_1280.png");
            background-size: contain;
            background-repeat: no-repeat;

            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 102;
        }

        h1 {
            background-color: gray;
            font-size: 3rem;
            width: auto;
            text-align: center;
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px 5px black;          
        }
        
    </style>
</head>
<body>
    <div class="content">
        <h1 class="counter" id="counter">
            Meow Counter: 0
        </h1>

        <div class="animalButtons">
            <button class="clicker" id="clicker" onclick="meowAction()">
                <div class="photo">
                    <h2>Meow!</h2>
                </div>
            </button>
        </div>
    </div>

    <script>
        let meowAmount = 0;
        const meowCounter = document.getElementById("counter");
        const meowAudio = new Audio("./audio/Cat_meow.wav");
        const meowAudio3 = new Audio("./audio/Meow3.wav");
        const meowAudio4 = new Audio("./audio/Meow4.wav");
        const meowAudio5 = new Audio("./audio/Meow5.wav");
        const meowAudio6 = new Audio("./audio/Meow6.wav");
        const meowAudio7 = new Audio("./audio/Meow7.wav");
        

        function meowAction() {
            let randomNumber = Math.round(Math.random() * 5);

            meowAmount += 1;
            meowCounter.textContent = "Meow Counter: " + meowAmount;

            if (randomNumber === 1) {
                meowAudio.currentTime = 0;
                meowAudio.play();
            } else if (randomNumber === 2) {
                meowAudio3.currentTime = 0;
                meowAudio3.play();
            } else if (randomNumber === 3) {
                meowAudio4.currentTime = 0;
                meowAudio4.play();
            } else if (randomNumber === 4) {
                meowAudio5.currentTime = 0;
                meowAudio5.play();
            } else if (randomNumber === 5) {
                meowAudio6.currentTime = 0;
                meowAudio6.play();
            } else {
                meowAudio7.currentTime = 0;
                meowAudio7.play();
            }
            console.log(randomNumber);
        };
        

    </script>
</body>
</html>
