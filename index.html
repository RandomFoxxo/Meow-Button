<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Button</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-image: linear-gradient(to bottom, black, gray);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            
            width: 100%;
            height: 100vh;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            width: 85%;
            height: 95%;

            background-color: rgba(255, 255, 255, 0.150);
            
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        button {
            width: 250px;
            height: 250px;

            background-color: rgba(255, 255, 255, 0.163);
            border-radius: 10px;
            box-shadow: 0 5px 10px black;
            position: absolute;
            top: 50%;
            transform: translateY(-25%);

            transition: all 0.1s ease-in-out;
        }

        button:hover {
            box-shadow: 0 5px 10px white;
            width: 255px;
            height: 255px;
            cursor: pointer;
        }

        button:active {
            width: 230px;
            height: 230px;
        }

        .photo {
            background-image: url("https://cdn.pixabay.com/photo/2023/10/26/10/33/cat-8342384_1280.png");
            background-size: contain;
            background-repeat: no-repeat;

            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 102;
        }

        h1 {
            background-color: gray;
            font-size: 3rem;
            width: auto;
            text-align: center;
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px 5px black;          
        }
        
    </style>
</head>
<body>
    <div class="content">
        <h1 class="counter" id="counter">
            Meow Counter: 0
        </h1>

        <button class="clicker" id="clicker" onclick="meowAction()">
            <div class="photo">
                <h2>Meow!</h2>
            </div>
        </button>
    </div>

    <script>
        var meowAmount = 0;
        const meowCounter = document.getElementById("counter");
        const meowAudio = new Audio("./audio/Cat_meow.wav");

        function meowAction() {
            meowAmount += 1;
            meowCounter.textContent = "Meow Counter: " + meowAmount;

            meowAudio.currentTime = 0;
            meowAudio.play();

        };
        

    </script>
</body>
</html>
